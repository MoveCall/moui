version: "0.1.5"
description: "Moui — lightweight mono-display UI framework for OLED, RLCD and E-Paper"
url: "https://github.com/movecall/moui"
license: "MIT"

targets:
  - esp32
  - esp32s2
  - esp32s3
  - esp32c3
  - esp32c6
  - esp32h2
  - esp32c61

dependencies:
  idf:
    version: ">=5.0"

files:
  exclude:
    - "host/**"
    - "test/**"
    - "tools/**"
    - "build/**"
    - "build*/**"
    - "dist/**"
    - "docs/**"
